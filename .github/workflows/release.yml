name: Release binaries
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package Unix
        if: runner.os != 'Windows'
        run: tar -czf tictactoe-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release tictactoe
      - name: Package Windows
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/${{ matrix.target }}/release/tictactoe.exe -DestinationPath tictactoe-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: tictactoe-${{ matrix.target }}
          path: tictactoe-*.*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        run: sha256sum artifacts/* > artifacts/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
